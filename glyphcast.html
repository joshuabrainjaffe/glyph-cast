<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e6e8ec">
<title>Glyphcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: full-height press-proof tool. Stage (artboard with crop marks on a cutting-mat grid) left, control rail right; stacks on phones. */
:root{
  --bg:#e6e8ec; --panel:#f2f3f5; --ink:#15171c; --muted:#5b6170; --line:#cfd3da; --stage:#d8dbe1; --dot:#c1c6ce;
  --field:#ffffff; --accent:#c8176a; --accent-ink:#ffffff; --ok:#1d7a4f;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#151920; --ink:#e3e6eb; --muted:#8b92a0; --line:#272c35; --stage:#0b0d11; --dot:#1c2028;
  --field:#0e1116; --accent:#ff4f9c; --accent-ink:#22040f; --ok:#5fd39b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#151920; --ink:#e3e6eb; --muted:#8b92a0; --line:#272c35; --stage:#0b0d11; --dot:#1c2028;
  --field:#0e1116; --accent:#ff4f9c; --accent-ink:#22040f; --ok:#5fd39b; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);height:100%}
header.bar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:10px;min-width:0}
.mark b{font-family:var(--f-mono);font-weight:600;letter-spacing:.32em;font-size:15px}
.mark span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.spec{flex:1;min-width:0;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--field);padding:7px 12px;border-radius:2px;cursor:pointer;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main.stage{position:relative;min-width:0;min-height:0;background-color:var(--stage);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px;display:grid;place-items:center;overflow:hidden}
.sheet{position:relative;line-height:0}
#view{display:block;cursor:grab;touch-action:none;box-shadow:0 1px 0 rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.18)}
#view.dragging{cursor:grabbing}
.crop{position:absolute;width:14px;height:14px;border-color:var(--muted);border-style:solid;border-width:0;pointer-events:none}
.crop.tl{left:-22px;top:-22px;border-right-width:1px;border-bottom-width:1px}
.crop.tr{right:-22px;top:-22px;border-left-width:1px;border-bottom-width:1px}
.crop.bl{left:-22px;bottom:-22px;border-right-width:1px;border-top-width:1px}
.crop.br{right:-22px;bottom:-22px;border-left-width:1px;border-top-width:1px}
.caption{position:absolute;left:0;right:0;top:calc(100% + 28px);line-height:1.3;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.hint{position:absolute;left:16px;top:12px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.05em}
.drop-veil{position:absolute;inset:10px;border:2px dashed var(--accent);display:grid;place-items:center;font-family:var(--f-mono);color:var(--accent);background:color-mix(in srgb,var(--stage) 80%,transparent);pointer-events:none}

aside.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;min-height:0}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);font-weight:400;color:var(--muted)}
details[open] summary::after{content:"−"}
.sec{display:grid;gap:12px;padding:2px 16px 16px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;min-width:0}
.row label,.lab{font-size:12.5px;color:var(--muted)}
.row output{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1}
.row select,.row textarea,.row .full{grid-column:1/-1}
select,textarea,input[type=text],input[type=number]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:2px;padding:7px 8px}
textarea{resize:vertical;min-height:58px;font-family:var(--f-mono);font-size:13px;line-height:1.35}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;background:var(--ink);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:11px;height:11px;background:var(--ink);border:0;border-radius:0}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:2px;overflow:hidden;grid-column:1/-1}
.seg button{border:0;background:var(--field);padding:6px 0;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cpick{display:grid;gap:4px;font-size:11.5px;color:var(--muted)}
input[type=color]{width:100%;height:28px;padding:0;border:1px solid var(--line);border-radius:2px;background:var(--field);cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:1px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1;align-items:center}
.swatches input[type=color]{width:30px;height:30px}
.swatches .mini{width:30px;height:30px;border:1px solid var(--line);background:var(--field);border-radius:2px;cursor:pointer;font-family:var(--f-mono);color:var(--muted)}
.swatches .mini:hover{border-color:var(--ink);color:var(--ink)}
.filebtn{display:flex;gap:8px;grid-column:1/-1}
.filebtn .btn{flex:1;text-align:center}
.note{font-size:11.5px;color:var(--muted);line-height:1.45;grid-column:1/-1;margin:0}
.readout{grid-column:1/-1;font-family:var(--f-mono);font-size:11px;line-height:1.7;color:var(--muted);border:1px solid var(--line);padding:8px 10px;font-variant-numeric:tabular-nums;background:var(--field)}
.readout b{color:var(--ink);font-weight:500}
.dims{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 6px;align-items:end;grid-column:1/-1}
.dims label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.dims input{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.swap{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--field);border-radius:2px;cursor:pointer;font-size:16px;line-height:1;color:var(--muted)}
.swap:hover{border-color:var(--ink);color:var(--ink)}
.swap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.canvas-row>.lab,.canvas-row>.dims,.canvas-row>.check{margin-top:8px}
.ratio{grid-column:1/-1;margin-top:4px;display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ratio i{flex:none;display:block;border:1.5px solid var(--ink);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ratio b{color:var(--ink);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;font-size:13px;border-radius:2px;max-width:calc(100% - 32px);z-index:5}
@media (max-width:760px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto;height:auto}
  aside.panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .spec{order:3;flex-basis:100%}
  .hint{display:none}
  #view{touch-action:pan-y}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="app">
  <header class="bar">
    <div class="mark"><b>GLYPHCAST</b><span aria-hidden="true"> .:-=+*#%@</span></div>
    <div class="spec" id="spec">—</div>
    <div class="actions">
      <button class="btn" id="surprise" type="button">Surprise me</button>
      <button class="btn primary" id="exportTop" type="button">Export SVG</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="hint">Drag to orbit · Scroll to zoom · Drop a font file</div>
    <div class="sheet" id="sheet">
      <canvas id="view" aria-label="ASCII render preview"></canvas>
      <i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>
      <div class="caption" id="caption"></div>
    </div>
    <div class="drop-veil" id="veil" hidden>Drop a .ttf, .otf or .woff font</div>
  </main>
  <aside class="panel" id="panel"></aside>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="fontFile" accept=".ttf,.otf,.woff" hidden>

function b64buf(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
const hexToRgb = h => {h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];};
const pack = (r,g,b) => ((r&255)<<16)|((g&255)<<8)|(b&255);

function getFont(key){
  if(uploaded[key]) return uploaded[key].font;
  if(!fontCache[key]) fontCache[key] = opentype.parse(b64buf(FONT_DATA[key]));
  return fontCache[key];
}
const glyphFaces = {}; // key -> {font, family, ready}
async function loadGlyphFace(key){
  if(glyphFaces[key]) return glyphFaces[key];
  const buf = b64buf(FONT_DATA['g_'+key]);
  const font = opentype.parse(buf.slice(0));
  const family = 'GC-'+key;
  const rec = {font, family, ready:false};
  glyphFaces[key] = rec;
  try{ const ff = new FontFace(family, buf); await ff.load(); document.fonts.add(ff); }catch(e){}
  rec.ready = true; return rec;
}

/* ---------- outline → THREE shapes ---------- */
function polyArea(p){let a=0;for(let i=0,j=p.length-1;i<p.length;j=i++)a+=(p[j][0]+p[i][0])*(p[j][1]-p[i][1]);return a/2;}
function pip(pt,poly){let x=pt[0],y=pt[1],ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function commandsToContours(cmds, ox, oy, seg){
  const out=[]; let cur=null, px=0, py=0;
  const P=(x,y)=>[x+ox,-y+oy];
  for(const c of cmds){
    if(c.type==='M'){ if(cur&&cur.length)out.push(cur); cur=[P(c.x,c.y)]; px=c.x;py=c.y; }
    else if(c.type==='L'){ cur.push(P(c.x,c.y)); px=c.x;py=c.y; }
    else if(c.type==='Q'){ for(let i=1;i<=seg;i++){const t=i/seg,u=1-t;cur.push(P(u*u*px+2*u*t*c.x1+t*t*c.x,u*u*py+2*u*t*c.y1+t*t*c.y));} px=c.x;py=c.y; }
    else if(c.type==='C'){ for(let i=1;i<=seg;i++){const t=i/seg,u=1-t;cur.push(P(u*u*u*px+3*u*u*t*c.x1+3*u*t*t*c.x2+t*t*t*c.x,u*u*u*py+3*u*u*t*c.y1+3*u*t*t*c.y2+t*t*t*c.y));} px=c.x;py=c.y; }
    else if(c.type==='Z'){ if(cur&&cur.length)out.push(cur); cur=null; }
  }
  if(cur&&cur.length)out.push(cur);
  // clean duplicates
  return out.map(pts=>{const r=[];for(const p of pts){const q=r[r.length-1];if(!q||Math.abs(q[0]-p[0])>1e-6||Math.abs(q[1]-p[1])>1e-6)r.push(p);}
    if(r.length>1){const a=r[0],b=r[r.length-1];if(Math.abs(a[0]-b[0])<1e-6&&Math.abs(a[1]-b[1])<1e-6)r.pop();}return r;});
}
function contoursToShapes(contours){
  const C = contours.filter(p=>p.length>=3).map(pts=>({pts,area:Math.abs(polyArea(pts))})).filter(c=>c.area>1e-7);
  for(const a of C){ a.parents = C.filter(b=>b!==a && b.area>a.area && pip(a.pts[0],b.pts)); a.depth=a.parents.length; }
  const V = pts => pts.map(p=>new THREE.Vector2(p[0],p[1]));
  const shapes = new Map();
  for(const a of C) if(a.depth%2===0) shapes.set(a, new THREE.Shape(V(a.pts)));
  for(const a of C) if(a.depth%2===1){
    let best=null; for(const b of a.parents) if(b.depth===a.depth-1 && (!best||b.area<best.area)) best=b;
    if(best && shapes.has(best)) shapes.get(best).holes.push(new THREE.Path(V(a.pts)));
  }
  return [...shapes.values()];
}
function buildShapes(font, text, o){
  const upm = font.unitsPerEm, lines = text.split('\n');
  const shapes=[];
  const lineData = lines.map(line=>{
    const glyphs = font.stringToGlyphs(line); let x=0; const pos=[];
    glyphs.forEach((g,i)=>{ if(i>0){ x += font.getKerningValue(glyphs[i-1],g)/upm; } pos.push(x); x += (g.advanceWidth||0)/upm + (i<glyphs.length-1?o.tracking:0); });
    return {glyphs,pos,width:x};
  });
  const maxW = Math.max(0.001,...lineData.map(l=>l.width));
  lineData.forEach((l,li)=>{
    const shift = o.align==='center'?(maxW-l.width)/2:o.align==='right'?(maxW-l.width):0;
    const oy = -li*o.leading;
    l.glyphs.forEach((g,i)=>{
      const path = g.getPath(0,0,1);
      const cs = commandsToContours(path.commands, l.pos[i]+shift, oy, o.curve);
      shapes.push(...contoursToShapes(cs));
    });
  });
  return shapes;
}

const material = new THREE.ShaderMaterial({
  uniforms, side:THREE.DoubleSide, blending:THREE.NoBlending, transparent:false,
  vertexShader:`
    varying vec3 vObj; varying vec3 vN; varying vec3 vView;
    void main(){ vObj=position; vec4 mv=modelViewMatrix*vec4(position,1.0); vView=-mv.xyz; vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*mv; }`,

    varying vec3 vObj; varying vec3 vN; varying vec3 vView;
    void main(){

    {t:'range', k:'tracking', label:'Tracking', min:-0.15, max:0.5, step:0.01, fmt:'em', geo:true},
    {t:'range', k:'leading', label:'Line spacing', min:0.6, max:1.6, step:0.01, fmt:'em', geo:true},
    {t:'seg', k:'align', label:'Align', opts:[['left','Left'],['center','Centre'],['right','Right']], geo:true},
  ]],
  ['Extrude', [
    {t:'range', k:'depth', label:'Depth', min:0, max:2.5, step:0.01, fmt:'em', geo:true},
    {t:'range', k:'bevel', label:'Bevel', min:0, max:0.08, step:0.002, fmt:'f2', geo:true},
    {t:'range', k:'curve', label:'Curve detail', min:2, max:16, step:1, fmt:'int', geo:true},
  ]],
  ['View', [
    {t:'range', k:'rotX', label:'Tilt', min:-85, max:85, step:1, fmt:'deg'},
    {t:'range', k:'rotY', label:'Turn', min:-85, max:85, step:1, fmt:'deg'},
    {t:'range', k:'rotZ', label:'Roll', min:-45, max:45, step:1, fmt:'deg'},
    {t:'range', k:'zoom', label:'Size in frame', min:0.3, max:3, step:0.01, fmt:'x'},
    {t:'range', k:'fov', label:'Perspective', min:4, max:100, step:1, fmt:'deg'},
  ]],
  ['Light', [
    {t:'range', k:'lightAz', label:'Key light direction', min:-180, max:180, step:1, fmt:'deg'},
    {t:'range', k:'lightEl', label:'Key light height', min:-90, max:90, step:1, fmt:'deg'},
    {t:'range', k:'ambient', label:'Ambient', min:0, max:1, step:0.01, fmt:'pct'},
    {t:'range', k:'rim', label:'Rim glow', min:0, max:1.5, step:0.01, fmt:'pct'},
    {t:'range', k:'depthFade', label:'Depth falloff', min:0, max:1, step:0.01, fmt:'pct'},
    {t:'colors', items:[['baseCol','Surface'],['keyCol','Key light'],['rimCol','Rim light']]},

  ['Characters', [

    {t:'custom'},

    {t:'range', k:'contrast', label:'Contrast', min:0.4, max:3, step:0.01, fmt:'x'},
    {t:'range', k:'brightness', label:'Brightness', min:-0.6, max:0.6, step:0.01, fmt:'signed'},
    {t:'check', k:'invert', label:'Invert ramp (for light paper)'},
    {t:'range', k:'edges', label:'Edge strokes  / | \\ -', min:0, max:1, step:0.01, fmt:'pct'},
    {t:'select', k:'bgFill', label:'Background texture', opts:[['none','Empty'],['dots','Dot grid'],['noise','Scattered glyphs']]},
    {t:'select', k:'glyphFont', label:'Glyph face', opts:GLYPH_FONTS.map(f=>[f.key,f.name])},
  ]],
  ['Colour', [
    {t:'select', k:'colorMode', label:'Colour mode', opts:[['gradient','Palette gradient (by brightness)'],['nearest','Palette nearest (by colour)'],['true','True colour'],['ansi','Classic ANSI 16']]},
    {t:'palette'},

  ['Export', [ {t:'sheet'} ]],

const panel=$('panel');
function el(tag,attrs={},html){ const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==='class')e.className=v; else e.setAttribute(k,v);} if(html!=null)e.innerHTML=html; return e; }
function setFill(inp){ const p=(inp.value-inp.min)/(inp.max-inp.min)*100; inp.style.setProperty('--p',p+'%'); }
const syncers=[];
function buildPanel(){
  SECTIONS.forEach(([title,items],si)=>{
    const d=el('details'); d.open=true;
    d.appendChild(el('summary',{},title)); const sec=el('div',{class:'sec'}); d.appendChild(sec); panel.appendChild(d);
    for(const it of items) sec.appendChild(control(it));
  });
}
function control(it){
  const row=el('div',{class:'row'});
  if(it.t==='range'){
    const id='c_'+it.k;
    row.append(el('label',{for:id},it.label)); const out=el('output',{for:id}); row.append(out);
    const inp=el('input',{type:'range',id,min:it.min,max:it.max,step:it.step}); row.append(inp);
    const sync=()=>{ inp.value=S[it.k]; out.textContent=FMT[it.fmt](S[it.k]); setFill(inp); };
    inp.addEventListener('input',()=>{ S[it.k]=+inp.value; out.textContent=FMT[it.fmt](S[it.k]); setFill(inp); if(it.k==='cols'){layoutView();} invalidate(it.geo); });
    syncers.push(sync); sync(); return row;
  }
  if(it.t==='textarea'){
    const id='c_'+it.k; row.append(el('label',{for:id},it.label));
    const ta=el('textarea',{id,rows:2,spellcheck:'false'}); row.append(ta);
    ta.addEventListener('input',()=>{ S[it.k]=ta.value; invalidate(true); });
    syncers.push(()=>ta.value=S[it.k]); ta.value=S[it.k]; return row;
  }
  if(it.t==='select'){
    const id='c_'+it.k; row.append(el('label',{for:id},it.label));
    const s=el('select',{id}); for(const [v,l] of it.opts) s.append(new Option(l,v)); row.append(s);
    s.addEventListener('change',async()=>{ S[it.k]=s.value; if(it.k==='glyphFont') await loadGlyphFace(s.value); onSelectChanged(it.k); invalidate(); });
    syncers.push(()=>s.value=S[it.k]); s.value=S[it.k]; return row;
  }
  if(it.t==='check'){
    const id='c_'+it.k; const lab=el('label',{class:'check',for:id}); const c=el('input',{type:'checkbox',id}); lab.append(c,document.createTextNode(it.label));
    row.append(lab); c.addEventListener('change',()=>{S[it.k]=c.checked;invalidate();}); syncers.push(()=>c.checked=S[it.k]); c.checked=S[it.k]; return row;
  }
  if(it.t==='seg'){
    row.append(el('span',{class:'lab'},it.label)); const seg=el('div',{class:'seg',role:'group','aria-label':it.label});
    const btns=it.opts.map(([v,l])=>{ const b=el('button',{type:'button','aria-pressed':'false'},l); b.addEventListener('click',()=>{S[it.k]=v;sync();invalidate(it.geo);}); seg.append(b); return [v,b]; });
    const sync=()=>btns.forEach(([v,b])=>b.setAttribute('aria-pressed',String(S[it.k]===v)));
    row.append(seg); syncers.push(sync); sync(); return row;
  }
  if(it.t==='colors'){
    const wrap=el('div',{class:'colors full'});
    for(const [k,l] of it.items){ const id='c_'+k; const lab=el('label',{class:'cpick',for:id},l); const c=el('input',{type:'color',id}); lab.append(c); wrap.append(lab);
      c.addEventListener('input',()=>{S[k]=c.value;invalidate();}); syncers.push(()=>c.value=S[k]); c.value=S[k]; }
    row.append(wrap); return row;
  }
  if(it.t==='font'){
    row.append(el('label',{for:'c_font'},'Typeface'));
    const s=el('select',{id:'c_font'}); row.append(s);
    const fill=()=>{ s.innerHTML=''; FONTS.forEach(f=>s.append(new Option(f.name,f.key))); const up=Object.entries(uploaded); if(up.length){ const og=el('optgroup',{label:'Your fonts'}); up.forEach(([k,v])=>og.append(new Option(v.name,k))); s.append(og);} s.value=S.font; };
    fill(); fontSelectFill=fill;
    s.addEventListener('change',()=>{S.font=s.value;invalidate(true);});
    const fb=el('div',{class:'filebtn'}); const b=el('button',{class:'btn',type:'button'},'Upload font (.ttf .otf .woff)'); b.addEventListener('click',()=>$('fontFile').click()); fb.append(b); row.append(fb);
    syncers.push(()=>s.value=S.font); return row;
  }
  if(it.t==='custom'){
    row.id='customRow';
    row.append(el('label',{for:'c_custom'},'Your characters'));
    const inp=el('input',{type:'text',id:'c_custom',spellcheck:'false'}); row.append(inp);
    const lab=el('label',{class:'check full',for:'c_seq'}); const c=el('input',{type:'checkbox',id:'c_seq'}); lab.append(c,document.createTextNode('Repeat in reading order (ignore brightness)')); row.append(lab);
    const note=el('p',{class:'note',id:'customNote'},'Order matters: lightest first, densest last.'); row.append(note);
    inp.addEventListener('input',()=>{S.custom=inp.value;invalidate();});
    c.addEventListener('change',()=>{S.sequence=c.checked;updateCustomNote();invalidate();});
    syncers.push(()=>{inp.value=S.custom;c.checked=S.sequence;row.hidden=S.style!=='custom';updateCustomNote();});
    inp.value=S.custom; c.checked=S.sequence; row.hidden=S.style!=='custom'; return row;
  }
  if(it.t==='palette'){
    row.append(el('label',{for:'c_palette'},'Palette'));
    const s=el('select',{id:'c_palette'}); Object.entries(PALETTES).forEach(([k,p])=>s.append(new Option(p.name,k))); s.append(new Option('Custom','custom')); row.append(s);
    const sw=el('div',{class:'swatches',id:'swatches'}); row.append(sw);
    const bgl=el('label',{class:'cpick full',for:'c_bg'},'Background'); const bgc=el('input',{type:'color',id:'c_bg'}); bgl.append(bgc); row.append(bgl);
    row.append(el('p',{class:'note'},'Gradient maps dark to light through the swatches in order. Nearest snaps each character to the closest swatch, which keeps a print to a fixed set of inks.'));
    s.addEventListener('change',()=>{ if(s.value!=='custom'){ const p=PALETTES[s.value]; S.swatches=p.sw.slice(); S.bg=p.bg; S.invert=p.invert; if(s.value==='ansi'&&S.colorMode==='gradient') S.colorMode='ansi'; } S.palette=s.value; rebuildLUT(); syncAll(); invalidate(); });
    bgc.addEventListener('input',()=>{S.bg=bgc.value;invalidate();});
    syncers.push(()=>{ s.value=S.palette; bgc.value=S.bg; renderSwatches(); });
    s.value=S.palette; bgc.value=S.bg; return row;
  }
  if(it.t==='canvas'){
    row.classList.add('canvas-row');
    row.append(el('label',{for:'c_format'},'Preset'));
    const s=el('select',{id:'c_format'}); row.append(s);
    const fillPresets=()=>{ s.innerHTML=''; Object.entries(FORMATS).forEach(([k,f])=>s.append(new Option(f.w?`${f.name} · ${fmtLen(f.w)} × ${fmtLen(f.h)} ${S.unit}`:'Custom size',k))); s.value=S.format; };
    row.append(el('span',{class:'lab'},'Units'));
    const seg=el('div',{class:'seg',role:'group','aria-label':'Units'});
    const ub=Object.keys(UNITS).map(u=>{ const b=el('button',{type:'button','aria-pressed':'false'},u); b.addEventListener('click',()=>{ S.unit=u; try{localStorage.setItem('glyphcast-unit',u);}catch(e){} syncAll(); updateSpec(); }); seg.append(b); return [u,b]; });
    row.append(seg);
    const dims=el('div',{class:'dims'});
    const wl=el('label',{for:'c_w'}), hl=el('label',{for:'c_h'});
    const wt=document.createElement('span'), ht=document.createElement('span');
    const w=el('input',{type:'number',id:'c_w',inputmode:'decimal'}), h=el('input',{type:'number',id:'c_h',inputmode:'decimal'});
    wl.append(wt,w); hl.append(ht,h);
    const sw=el('button',{class:'swap',type:'button','aria-label':'Swap width and height',title:'Swap orientation'},'⇄');
    dims.append(wl,sw,hl); row.append(dims);
    const lk=el('label',{class:'check full',for:'c_lock'}); const lc=el('input',{type:'checkbox',id:'c_lock'}); lk.append(lc,document.createTextNode('Lock aspect ratio')); row.append(lk);
    const ratio=el('div',{class:'ratio',id:'ratio'}); row.append(ratio);
    const apply=(W,H)=>{ S.widthMM=W; S.heightMM=H; const m=Object.entries(FORMATS).find(([k,f])=>f.w===W&&f.h===H); S.format=m?m[0]:'custom'; if(S.lockAspect) S.lockRatio=W/H; syncAll(); layoutView(); invalidate(); };
    s.addEventListener('change',()=>{ const f=FORMATS[s.value]; if(f.w) apply(f.w,f.h); else { S.format='custom'; syncAll(); } });
    const onDim=(which)=>{
      const f=UNITS[S.unit].f; let W=S.widthMM, H=S.heightMM;
      const v=parseFloat((which==='w'?w:h).value);
      if(!isFinite(v)||v<=0){ syncAll(); return; }
      const mm=clampMM(v*f);
      if(which==='w'){ W=mm; if(S.lockAspect) H=clampMM(W/S.lockRatio); } else { H=mm; if(S.lockAspect) W=clampMM(H*S.lockRatio); }
      const r=W/H;
      if(r>MAX_RATIO||r<1/MAX_RATIO){ toast(`Keep the sides within ${MAX_RATIO}:1 of each other. Try a longer ${which==='w'?'height':'width'}.`); syncAll(); return; }
      if(mm!==Math.round(v*f*100)/100) toast(`Sizes run from ${fmtLen(MIN_MM)} to ${fmtLen(MAX_MM)} ${S.unit}.`);
      const keepRatio=S.lockRatio; apply(W,H); if(S.lockAspect) S.lockRatio=keepRatio;
    };
    w.addEventListener('change',()=>onDim('w')); h.addEventListener('change',()=>onDim('h'));
    sw.addEventListener('click',()=>{ const keep=S.lockRatio; apply(S.heightMM,S.widthMM); if(S.lockAspect) S.lockRatio=1/keep; });
    lc.addEventListener('change',()=>{ S.lockAspect=lc.checked; S.lockRatio=S.widthMM/S.heightMM; });
    syncers.push(()=>{
      const u=UNITS[S.unit]; fillPresets();
      ub.forEach(([k,b])=>b.setAttribute('aria-pressed',String(k===S.unit)));
      wt.textContent=`Width (${S.unit})`; ht.textContent=`Height (${S.unit})`;
      for(const inp of [w,h]){ inp.step=u.step; inp.min=fmtLen(MIN_MM); inp.max=fmtLen(MAX_MM); }
      w.value=fmtLen(S.widthMM); h.value=fmtLen(S.heightMM); lc.checked=S.lockAspect;
      const r=S.widthMM/S.heightMM, bw=r>=1?30:Math.max(4,30*r), bh=r>=1?Math.max(4,30/r):30;
      const rt = Math.abs(r-1)<0.005?'1 : 1':r>1?`${trimNum(r,2)} : 1`:`1 : ${trimNum(1/r,2)}`;
      const orient = Math.abs(r-1)<0.005?'Square':r>1?'Landscape':'Portrait';
      ratio.innerHTML=''; const box=el('i'); box.style.width=bw+'px'; box.style.height=bh+'px';
      const t=el('span'); t.innerHTML=`<b>${rt}</b> · ${orient} · ${trimNum(S.widthMM*S.heightMM/1e6,2)} m²`;
      ratio.append(box,t);
    });
    return row;
  }
  if(it.t==='sheet'){
    const ro=el('div',{class:'readout',id:'readout'}); row.append(ro);
    const b1=el('button',{class:'btn primary',type:'button'},'Export SVG'); b1.addEventListener('click',exportSVG);
    const b2=el('button',{class:'btn',type:'button'},'Copy SVG'); b2.addEventListener('click',()=>{ const g=grid; if(!g)return; copyString(buildSVG(g),'SVG'); });
    const b3=el('button',{class:'btn',type:'button'},'Copy text'); b3.addEventListener('click',()=>{ if(grid) copyString(buildText(grid),'Plain text'); });
    const fb=el('div',{class:'filebtn'}); fb.append(b1); const fb2=el('div',{class:'filebtn'}); fb2.append(b2,b3); row.append(fb,fb2);
    row.append(el('p',{class:'note'},'SVG export outlines every glyph and is set to the exact canvas size, so it needs no fonts installed and holds its edges at any print size.'));
    return row;
  }
  return row;
}
let fontSelectFill=()=>{};
function updateCustomNote(){ const n=$('customNote'); if(!n)return; n.textContent = S.sequence ? 'Characters repeat left to right inside the letters; brightness only sets colour.' : (customInfo.dropped?'Some characters are missing from the glyph face and were skipped. ':'')+'Order matters: lightest first, densest last.'; }
function renderSwatches(){
  const box=$('swatches'); if(!box) return; box.innerHTML='';
  S.swatches.forEach((c,i)=>{ const nm=BRAND_NAMES[c.toLowerCase()]; const inp=el('input',{type:'color','aria-label':nm||`Swatch ${i+1}`,title:nm?`${nm} ${c.toUpperCase()}`:c.toUpperCase()}); inp.value=c; inp.addEventListener('input',()=>{S.swatches[i]=inp.value;S.palette='custom';$('c_palette').value='custom';rebuildLUT();invalidate();}); box.append(inp); });
  const add=el('button',{class:'mini',type:'button','aria-label':'Add swatch'},'+'); add.addEventListener('click',()=>{ if(S.swatches.length>=10)return; S.swatches.push(S.swatches[S.swatches.length-1]||'#ffffff'); S.palette='custom'; rebuildLUT(); syncAll(); invalidate(); });
  const rem=el('button',{class:'mini',type:'button','aria-label':'Remove last swatch'},'−'); rem.addEventListener('click',()=>{ if(S.swatches.length<=1)return; S.swatches.pop(); S.palette='custom'; rebuildLUT(); syncAll(); invalidate(); });
  box.append(add,rem);
}
function syncAll(){ syncers.forEach(f=>f()); }
function onSelectChanged(k){ if(k==='style') syncAll(); if(k==='colorMode') rebuildLUT(); }

/* ---------- spec readout ---------- */
function updateSpec(){
  const {cols,rows}=gridDims(); const f=FORMATS[S.format];
  const cellW=S.widthMM/cols, cellH=cellW/CELL_ASPECT;
  const sub = S.style==='braille'?' · 2×4 dots/cell':S.style==='half'?' · 2 px/cell':'';
  const fmtmm=v=>v>=10?v.toFixed(0):v.toFixed(1);
  const name=(f&&f.w)?f.name:'Custom sheet';
  const size=`${fmtLen(S.widthMM)} × ${fmtLen(S.heightMM)} ${S.unit}`;
  $('spec').textContent=`${name} · ${size} · ${cols}×${rows} cells · ${(cols*rows).toLocaleString()} glyphs`;
  $('caption').textContent=`${size} · 1 cell = ${fmtmm(cellW)} × ${fmtmm(cellH)} mm${sub}`;
  const capped = gridDims().capped ? `<br>Density capped at ${MAX_CELLS.toLocaleString()} cells for this shape` : '';
  const ro=$('readout'); if(ro) ro.innerHTML=`Canvas <b>${size}</b><br>Grid <b>${cols} × ${rows}</b> cells<br>Cell at print <b>${fmtmm(cellW)} × ${fmtmm(cellH)} mm</b><br>Viewing distance for a smooth read ≈ <b>${(cellH*0.35).toFixed(1)} m</b><br>Detail is lost below ≈ <b>${(cellH*0.035).toFixed(1)} m</b>${capped}`;
}

/* ---------- interactions ---------- */
let drag=null;
view.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,rx:S.rotX,ry:S.rotY}; view.setPointerCapture(e.pointerId); view.classList.add('dragging'); });
view.addEventListener('pointermove',e=>{ if(!drag)return; S.rotY=Math.max(-85,Math.min(85,drag.ry+(e.clientX-drag.x)*0.35)); S.rotX=Math.max(-85,Math.min(85,drag.rx+(e.clientY-drag.y)*0.35)); syncRot(); invalidate(); });
const endDrag=()=>{ drag=null; view.classList.remove('dragging'); };
view.addEventListener('pointerup',endDrag); view.addEventListener('pointercancel',endDrag);
view.addEventListener('wheel',e=>{ e.preventDefault(); S.zoom=Math.max(0.3,Math.min(3,S.zoom*Math.exp(-e.deltaY*0.0012))); syncRot(); invalidate(); },{passive:false});
function syncRot(){ for(const k of ['rotX','rotY','zoom']){ const i=$('c_'+k); if(i){ i.value=S[k]; setFill(i); i.previousElementSibling.textContent = k==='zoom'?FMT.x(S[k]):FMT.deg(S[k]); } } }

async function loadFontFile(file){
  try{
    const buf=await file.arrayBuffer(); const font=opentype.parse(buf);
    if(!font.glyphs||font.glyphs.length<2) throw new Error('empty');
    const key='up_'+Date.now(); const name=(font.names.fullName&&(font.names.fullName.en||Object.values(font.names.fullName)[0]))||file.name;
    uploaded[key]={key,name,font}; S.font=key; fontSelectFill(); invalidate(true); toast(`Loaded ${name}.`);
  }catch(e){ toast("That font couldn't be read. Use .ttf, .otf or .woff (not .woff2)."); }
}
$('fontFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) loadFontFile(f); e.target.value=''; });
const stage=$('stage'); let dragDepth=0;
stage.addEventListener('dragenter',e=>{ e.preventDefault(); dragDepth++; $('veil').hidden=false; });
stage.addEventListener('dragleave',()=>{ if(--dragDepth<=0){dragDepth=0;$('veil').hidden=true;} });
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',e=>{ e.preventDefault(); dragDepth=0; $('veil').hidden=true; const f=e.dataTransfer.files[0]; if(!f)return;
  if(/\.(ttf|otf|woff2?)$/i.test(f.name)) loadFontFile(f); else toast('Drop a .ttf, .otf or .woff font file.'); });

$('exportTop').addEventListener('click',exportSVG);
$('surprise').addEventListener('click',async()=>{
  const R=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
  S.font=pick(FONTS).key; S.depth=+R(0.15,1.6).toFixed(2); S.bevel=+pick([0,0.01,0.02,0.04]).toFixed(3);
  S.rotX=Math.round(R(-38,30)); S.rotY=Math.round(R(-55,55)); S.rotZ=Math.round(pick([0,0,R(-14,14)])); S.fov=Math.round(R(12,70)); S.zoom=+R(0.85,1.25).toFixed(2);
  S.lightAz=Math.round(R(-150,150)); S.lightEl=Math.round(R(-10,70)); S.rim=+R(0.1,1).toFixed(2); S.depthFade=+R(0.2,0.9).toFixed(2);
  S.style=pick(['classic','detailed','detailed','blocks','half','braille','binary']); S.cols=Math.round(R(50,150)/2)*2;
  S.edges=+pick([0,0.25,0.5,0.7]).toFixed(2); S.bgFill=pick(['none','dots','noise']); S.contrast=+R(1,1.8).toFixed(2);
  const pk=pick(Object.keys(PALETTES)); const p=PALETTES[pk]; S.palette=pk; S.swatches=p.sw.slice(); S.bg=p.bg; S.invert=p.invert;
  S.colorMode = pk==='ansi' ? 'ansi' : pick(['gradient','gradient','nearest','true']);
  if(S.colorMode==='true'){ S.keyCol=pick(['#ffd6a0','#ff7aa8','#9be7ff','#fff1dc']); S.rimCol=pick(['#6fd3ff','#ff4fd8','#ffe14d','#7dff9b']); }
  rebuildLUT(); syncAll(); fontSelectFill(); layoutView(); invalidate(true);
});
new ResizeObserver(()=>{ layoutView(); invalidate(); }).observe($('stage'));

/* ---------- boot ---------- */
try{ const u=localStorage.getItem('glyphcast-unit'); if(u&&UNITS[u]) S.unit=u; }catch(e){}
buildPanel(); rebuildLUT(); syncAll();
if(!renderer){ toast('WebGL is unavailable in this browser, so the 3D render cannot run.'); }
loadGlyphFace(S.glyphFont).then(()=>{ layoutView(); invalidate(true); });
layoutView(); invalidate(true);
</script>
